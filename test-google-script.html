<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Google Apps Script 테스트</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    button {
      padding: 10px 20px;
      margin: 10px 5px;
      font-size: 16px;
      cursor: pointer;
    }
    #result1, #result2, #result3 {
      margin-top: 20px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 5px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>🧪 Google Apps Script 테스트</h1>
  
  <div>
    <button onclick="testRegisterMatch()">1. 매치 등록 테스트</button>
    <button onclick="testUpdateStats()">2. 통계 업데이트 테스트</button>
    <button onclick="testRegisterPlayers()">3. 선수 등록 테스트</button>
  </div>
  
  <div id="result1">결과가 여기에 표시됩니다...</div>
  <div id="result2">결과가 여기에 표시됩니다...</div>
  <div id="result3">결과가 여기에 표시됩니다...</div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyIuKqTth3qFqDzEkDrAjvOc2tqrxEU6lsXO6hULDKy7y65Zye_zoHeu4W3HhzcXXuTtA/exec";

    async function testRegisterMatch() {
      const resultDiv = document.getElementById("result1");
      resultDiv.textContent = "전송 중...";
      
      const testData = {
        action: "registerMatch",
        match: {
          id: "test-" + Date.now(),
          date: "2026-02-05",
          opponent: "테스트 상대팀",
          location: "테스트 장소",
          startTime: "19:00",
          endTime: "21:00",
          quarterCount: 4,
          quarterTime: 10,
          playerCount: 8
        }
      };
      
      try {
        const response = await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(testData),
          redirect: "follow"
        });
        
        // Google Apps Script는 항상 200을 반환하므로 텍스트로 읽어야 함
        const text = await response.text();
        const data = JSON.parse(text);
        
        resultDiv.textContent = `✅ 성공!\n\n${JSON.stringify(data, null, 2)}`;
      } catch (error) {
        resultDiv.textContent = `❌ 실패: ${error.message}`;
        console.error("에러:", error);
      }
    }

    async function testUpdateStats() {
      const resultDiv = document.getElementById("result2");
      resultDiv.textContent = "전송 중...";
      
      const testData = {
        action: "updateStats",
        stats: [
          { 이름: "손흥민", 골: 2, 도움: 1 },
          { 이름: "이강인", 골: 1, 도움: 2 }
        ]
      };
      
      try {
        const response = await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(testData),
          redirect: "follow"
        });
        
        const text = await response.text();
        const data = JSON.parse(text);
        
        resultDiv.textContent = `✅ 성공!\n\n${JSON.stringify(data, null, 2)}`;
      } catch (error) {
        resultDiv.textContent = `❌ 실패: ${error.message}`;
        console.error("에러:", error);
      }
    }

    async function testRegisterPlayers() {
      const resultDiv = document.getElementById("result3");
      resultDiv.textContent = "전송 중...";
      
      const testData = {
        action: "registerPlayers",
        players: [
          { 번호: 10, 이름: "손흥민", 골: 0, 도움: 0 },
          { 번호: 7, 이름: "이강인", 골: 0, 도움: 0 },
          { 번호: 9, 이름: "황희찬", 골: 0, 도움: 0 }
        ]
      };
      
      try {
        const response = await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(testData),
          redirect: "follow"
        });
        
        const text = await response.text();
        const data = JSON.parse(text);
        
        resultDiv.textContent = `✅ 성공!\n\n${JSON.stringify(data, null, 2)}`;
      } catch (error) {
        resultDiv.textContent = `❌ 실패: ${error.message}`;
        console.error("에러:", error);
      }
    }
  </script>
</body>
</html>
